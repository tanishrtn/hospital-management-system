{% extends 'base.html' %}

{% block content %}

<h2 class="text-2xl font-semibold mb-6">Doctors</h2>

<div class="bg-gray-900 p-6 rounded-2xl shadow border border-gray-800">

    <table class="w-full text-left">
        <thead>
            <tr class="border-b border-gray-700 text-gray-400">
                <th class="py-2">Name</th>
                <th class="py-2">Department</th>
                <th class="py-2">Experience</th>
            </tr>
        </thead>

        <tbody>
            {% for d in doctors %}
            <tr class="border-b border-gray-800 hover:bg-gray-800 transition">
                <td class="py-3">{{ d.name }}</td>
                <td class="py-3">{{ d.department }}</td>
                <td class="py-3">{{ d.experience }} yrs</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="py-4 text-center text-gray-500">
                    No doctors available
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}
