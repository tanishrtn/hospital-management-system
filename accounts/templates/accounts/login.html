<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen bg-cover bg-center bg-no-repeat text-white"
      style="background-image: url('{% static 'images/bg.jpg' %}')">


<div class="h-full flex items-center justify-center bg-black/60">

    <div class="bg-gray-800/80 backdrop-blur-lg p-8 rounded-xl shadow-xl w-96">

        <h2 class="text-2xl font-bold text-center mb-6">
            🩺 KMC Login
        </h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username"
            class="w-full p-3 rounded bg-gray-700 text-white">

            <input type="password" name="password" placeholder="Password"
            class="w-full p-3 rounded bg-gray-700 text-white">

            <button type="submit"
            class="w-full bg-blue-600 p-3 rounded text-white hover:bg-blue-700">
                Login
            </button>
        </form>

        <p class="text-center mt-4 text-gray-400">
            <a href="/register/" class="hover:text-white">Create account</a>
        </p>

    </div>

</div>

</body>
</html>
