{% extends 'base.html' %}
{% block title %}Patients{% endblock %}

{% block content %}

<h2 class="text-xl font-semibold mb-4">Patients</h2>

<form method="POST" class="grid grid-cols-2 gap-4 mb-6">
    {% csrf_token %}

    {% if form.errors %}<div class="col-span-2 text-red-300">{{ form.errors }}</div>{% endif %}

    <input name="name" placeholder="Name" class="p-2 rounded bg-gray-800 border border-gray-700">
    <input name="age" placeholder="Age" class="p-2 rounded bg-gray-800 border border-gray-700">
    <input name="gender" placeholder="Gender" class="p-2 rounded bg-gray-800 border border-gray-700">
    <input name="contact" placeholder="Contact" class="p-2 rounded bg-gray-800 border border-gray-700">

    <textarea name="reason" placeholder="Reason" class="col-span-2 p-2 rounded bg-gray-800 border border-gray-700"></textarea>

    <button class="col-span-2 bg-blue-500 p-2 rounded hover:bg-blue-600">Add Patient</button>
</form>

<table class="w-full">
    <tr class="text-gray-400 border-b border-gray-700">
        <th>Name</th>
        <th>Age</th>
        <th>Reason</th>
        <th>Action</th>
    </tr>

    {% for p in patients %}
    <tr class="border-b border-gray-800">
        <td>{{ p.name }}</td>
        <td>{{ p.age }}</td>
        <td>{{ p.reason }}</td>
        <td>
            <form method="post" action="{% url 'delete_patient' p.id %}">
                {% csrf_token %}
                <button type="submit" class="text-red-400">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
