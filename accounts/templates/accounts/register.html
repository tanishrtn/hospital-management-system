<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NoctraCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0e17] text-white">

    <div class="flex justify-center items-center min-h-screen w-full">
        <div class="bg-[#111827] p-8 rounded-2xl shadow-2xl border border-gray-800 w-full max-w-md">

            <h2 class="text-3xl font-bold mb-8 text-center">Create Account</h2>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Username</label>
                    <input type="text" name="username" class="w-full p-2.5 rounded bg-white text-black outline-none">
                    <p class="text-[10px] text-gray-500 mt-1">150 characters or fewer.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" name="password1" class="w-full p-2.5 rounded bg-white text-black">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Confirm Password</label>
                    <input type="password" name="password2" class="w-full p-2.5 rounded bg-white text-black">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">User Type</label>
                    <select name="user_type" class="w-full p-2.5 rounded bg-white text-black">
                        <option value="admin">Admin</option>
                        <option value="doctor">Doctor</option>
                        <option value="patient">Patient</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-[#2563eb] hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition mt-4">
                    Register
                </button>
            </form>

            <p class="text-sm text-gray-400 text-center mt-6">
                Already have an account? <a href="/login/" class="text-blue-500 hover:underline">Login</a>
            </p>
        </div>
    </div>

</body>
</html>
